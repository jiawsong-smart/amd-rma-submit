function subIndex(subs) {
  const map = {};
  subs.forEach(sub => {
    const cat = sub.includes("-") ? sub.slice(0, sub.indexOf("-")) : sub;
    if (/TBD/i.test(sub)) map[cat] = sub;
    else if (!(cat in map) && sub === cat) map[cat] = sub;
  });
  subs.forEach(sub => {
    if (!/TBD/i.test(sub)) return;
    const cat = sub.includes("-") ? sub.slice(0, sub.indexOf("-")) : sub;
    map[cat] = sub;
  });
  return map;
}

const CPU_SUB_BY_CAT = subIndex(CPU_FAIL_SUBS);
function failPack() {

}
function matchFailSub(category) {
  const cat = String(category || "").trim();
  if (!cat) return "";
  const pack = failPack();
  if (pack.map[cat]) return pack.map[cat];
  const tbd = `${cat}-TBD`;
  if (pack.subs.includes(tbd)) return tbd;
  if (pack.subs.includes(cat)) return cat;
  return "";
}

  };

function fresh() {
  return {
    gpu: GPU_EXAMPLES.map(r => ({ ...r })),
    cpu: CPU_EXAMPLES.map(r => ({ ...r })),
    contact: emptyContact()
  };
}
function loadAll() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.gpu) && Array.isArray(parsed.cpu)) {
        const gpu = parsed.gpu.map(normalize);
        const cpu = parsed.cpu.map(normalize);
        const contact = normalizeContact(parsed.contact);
        if ((!gpu.length || gpu.every(r => r.example)) && (!cpu.length || cpu.every(r => r.example))) {
          const base = fresh();
          base.contact = contact;
          return base;
        }
        return { gpu: gpu.length ? gpu : fresh().gpu, cpu: cpu.length ? cpu : fresh().cpu, contact };
      }
    }
    const old = localStorage.getItem(OLD_STORE);
    if (old) {
      const parsed = JSON.parse(old);
      if (Array.isArray(parsed) && parsed.length && !parsed.every(r => r.example)) {
        const gpu = [];
        const cpu = [];
        parsed.forEach(r => {
          const row = normalize(r);
          if (/^EPYC/i.test(row.product)) cpu.push(row);
          else gpu.push(row);
        });
        const base = fresh();
        return { gpu: gpu.length ? gpu : base.gpu, cpu: cpu.length ? cpu : base.cpu, contact: emptyContact() };
      }
    }
  } catch (e) {}
  return fresh();
}

    + list.filter(Boolean).map(v => `<option value="${esc(v)}"${v === val ? " selected" : ""}>${esc(v)}</option>`).join("")
    + `<option value="__other"${!known && val ? " selected" : ""}>${esc(t("other"))}</option>`;
  const custom = known ? "" : val;

    + `<input data-i="${i}" data-k="${key}" data-custom="1" type="text" placeholder="${esc(t("custom"))}" value="${esc(custom)}" style="margin-top:4px;${known || !val ? "display:none" : ""}" />`;

const CRC_TABLE = (() => {

function sheetXml(matrix, validations, hideFromCol) {

    cols.push(`<col min="${i}" max="${i}" width="${w}" customWidth="1"${hidden}/>`);
  }

    const cells = row.map((v, c) => {

    }).join("");
    return `<row r="${r + 1}">${cells}</row>`;
  }).join("");

    ? `<dataValidations count="${validations.length}">${validations.map(v =>

<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>

function buildValidatedSheet(headers, dataRows, listsByHeader) {
  const optionLists = [];

    const values = listsByHeader[h];
    if (!values || !values.length) return;
    const optCol = headers.length + optionLists.length + 1;
    optionLists.push(values);
    validations.push({
      sqref: `${colLetter(i + 1)}2:${colLetter(i + 1)}500`,
      formula: `$${colLetter(optCol)}$1:$${colLetter(optCol)}$${values.length}`
    });
  });
  const height = Math.max(dataRows.length + 1, ...optionLists.map(l => l.length), 2);
  const wide = [];
  for (let r = 0; r < height; r++) {
    const base = r === 0 ? headers.slice() : (dataRows[r - 1] || headers.map(() => "")).slice();
    while (base.length < headers.length) base.push("");
    optionLists.forEach(list => base.push(list[r] || ""));

}

function dayDiff(fail, deploy) {

  const a = new Date(fail + "T00:00:00");
  const b = new Date(deploy + "T00:00:00");

function splitBarcode(v) {

}
function toHotpotMatrix() {
  const data = rows.map(r => {
    const fromBarcode = family === "cpu" ? splitBarcode(r.barcode) : { sn: "", opn: "" };
    const sn = family === "gpu" ? (r.sn || "") : fromBarcode.sn;
    const opn = fromBarcode.opn;
    const part = r.partType || "";
    const fail = r.failure || "";
    const cat = failPack().cats.includes(fail) ? fail : "";
    const sub = matchFailSub(cat);
    return [
      r.failDate || "",
      "",
      "N",
      "",
      "",
      r.product || "",
      sn,
      opn,
      part,
      (r.customer || "").toUpperCase(),
      r.odm || "",
      r.location || "",
      r.stage || "",
      r.deployDate || "",
      dayDiff(r.failDate, r.deployDate),
      "",
      fail,
      "",
      cat,
      sub,
      part,
      "",
      "Y",
      "Y",
      ""

function toBase64(bytes) {

    s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }

}

function parseCsvTable(text) {
  const rawLines = String(text || "").replace(/^\uFEFF/, "").split(/\r?\n/);

  return (cut < 0 ? rawLines : rawLines.slice(0, cut)).filter(l => l.trim()).map(splitCsv);
}
function colIndex(letters) {
  let n = 0;
  for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);

function normalizeDate(v) {
  const s = String(v || "").trim();
  if (!s) return "";
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const num = Number(s);
  if (Number.isFinite(num) && num > 20000 && num < 80000) {
    const d = new Date(Date.UTC(1899, 11, 30) + Math.round(num) * 86400000);
    const m = String(d.getUTCMonth() + 1).padStart(2, "0");
    const day = String(d.getUTCDate()).padStart(2, "0");
    return `${d.getUTCFullYear()}-${m}-${day}`;
  }
  return s;
}
async function readZip(buf) {
  const u8 = new Uint8Array(buf);
  const view = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("zip");
  const count = view.getUint16(eocd + 10, true);
  let p = view.getUint32(eocd + 16, true);
  const files = {};
  for (let i = 0; i < count; i++) {
    if (view.getUint32(p, true) !== 0x02014b50) break;
    const method = view.getUint16(p + 10, true);
    const compSize = view.getUint32(p + 20, true);
    const nameLen = view.getUint16(p + 28, true);
    const extraLen = view.getUint16(p + 30, true);
    const commentLen = view.getUint16(p + 32, true);
    const localOff = view.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));
    const ln = view.getUint16(localOff + 26, true);
    const le = view.getUint16(localOff + 28, true);
    const start = localOff + 30 + ln + le;
    const comp = u8.subarray(start, start + compSize);
    let bytes = comp;
    if (method === 8) {
      const stream = new Blob([comp]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    files[name] = new TextDecoder().decode(bytes);
    p += 46 + nameLen + extraLen + commentLen;
  }
  return files;
}
function nodes(parent, name) {
  return [...parent.getElementsByTagName("*")].filter(n => n.localName === name);
}
function sharedStrings(xml) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");

}
function sheetRows(xml, strings) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  return nodes(doc, "row").map(row => {
    const line = [];
    nodes(row, "c").forEach(c => {
      const idx = colIndex((c.getAttribute("r") || "A").replace(/[0-9]/g, "")) - 1;
      const type = c.getAttribute("t");
      let val = "";
      if (type === "inlineStr") val = nodes(c, "t").map(t => t.textContent || "").join("");
      else {
        const raw = (nodes(c, "v")[0] || {}).textContent || "";
        val = type === "s" ? (strings[Number(raw)] || "") : raw;
      }
      while (line.length < idx) line.push("");
      line[idx] = val;
    });
    return line;
  });
}
async function readXlsx(buf) {
  const files = await readZip(buf);
  const sheet = files["xl/worksheets/sheet1.xml"];
  if (!sheet) throw new Error("sheet");
  return sheetRows(sheet, files["xl/sharedStrings.xml"] ? sharedStrings(files["xl/sharedStrings.xml"]) : []);
}
function applyImportedRows(header, body) {
  const names = header.map(x => String(x || "").trim());
  let next = family;
  if (names.includes("Part Type") || names.includes("SN")) next = "gpu";
  else if (names.includes("2D Barcode(SN_OPN)")) next = "cpu";
  const lineIdx = names.indexOf("Product Line");
  if (lineIdx >= 0) {
    const marks = body.map(r => String(r[lineIdx] || "").trim()).filter(Boolean);
    if (marks.length && marks.every(v => v === "EPYC")) next = "cpu";
    if (marks.length && marks.every(v => v === "INSTINCT")) next = "gpu";
  }
  if (next !== family) {
    buckets[family] = rows;
    family = next;
    rows = buckets[family] || [];
  }
  const keys = schema().keys;
  const idx = keys.map(k => names.indexOf(HEADER[k]));
  const missing = keys.filter((k, n) => k !== "location" && idx[n] < 0);
  if (missing.length) { setStatus(t("importBad"), "err"); return; }
  rows = body.map(cells => {
    const row = blank();
    keys.forEach((k, n) => {
      let v = String(cells[idx[n]] || "").trim();
      if (k === "failDate" || k === "deployDate") v = normalizeDate(v);
      row[k] = v;
    });
    return row;
  }).filter(r => keys.some(k => r[k]));
  if (!rows.length) rows.push(blank());
  applyLang();
  render();
  setStatus(tf("imported", rows.length), "ok");
}
function splitCsv(line) {
  const out = [];
  let cur = "";
  let q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

}
